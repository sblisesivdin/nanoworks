name: Publish release installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to receive the installer asset
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/release-installer.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out installer source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$(gh release view --json tagName --jq .tagName)"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){2}([A-Za-z0-9.-]+)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 2
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build version-pinned installer
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p dist
          {
            printf '#!/bin/bash\n'
            printf 'export NANOWORKS_VERSION=%q\n' "$VERSION"
            tail -n +2 install_scripts/install-all-Debian-based.sh
          } > dist/install-all-Debian-based.sh
          chmod +x dist/install-all-Debian-based.sh
          bash -n dist/install-all-Debian-based.sh
          grep -Fx "export NANOWORKS_VERSION=$VERSION" dist/install-all-Debian-based.sh

      - name: Upload installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" dist/install-all-Debian-based.sh --clobber
