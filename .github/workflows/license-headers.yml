name: License headers

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  license-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source license headers
        run: python3 scripts/check_license_headers.py
