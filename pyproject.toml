[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Retain compatibility with setuptools versions available on Python 3.8.
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["nanoworks*"]

[tool.setuptools.package-data]
"nanoworks" = ["examples/*", "examples/**/*"]

[tool.setuptools.dynamic]
version = {attr = "nanoworks.__version__"}

[project]
name = "nanoworks"
dynamic = ["version"]
description = " Nanoworks is a unified, high-level Python orchestrator for conducting DFT, MD and ML calculations"
readme = "README.md"
requires-python = ">=3.8" 
license = { file = "LICENSE.md" }
authors = [{name = "Sefer Bora Lisesivdin" }, {name = "Beyza Sarikavak-Lisesivdin"}]
dependencies = [
    "ase>=3.23.0",
    "spglib",
    "docutils"
]

[project.optional-dependencies]

gpaw = [
    "gpaw>=26.7.0",
    "elastic",
    "phonopy",
    "pyrapl",
    "pymongo",
    "pandas"
]

qe = [
    "phonopy",
]

dft = [
    "gpaw>=26.7.0",
    "elastic",
    "phonopy",
    "pyrapl",
    "pymongo",
    "pandas"
]

md = [
    "asap3",
    "kimpy"
]

ml = [
    "torch",
    "mace-torch",
    "chgnet",
    "sevenn"
]

all = [
    "gpaw>=26.7.0",
    "elastic",
    "phonopy",
    "pyrapl",
    "pymongo",
    "pandas",
    "asap3",
    "kimpy",
    "torch",
    "mace-torch",
    "chgnet",
    "sevenn",
    "cython==3.1.3"
]

[project.scripts]
dftsolve = "nanoworks.dftsolve:main"
dftconverge = "nanoworks.dftconverge:main"
mdsolve = "nanoworks.mdsolve:main"
mlsolve = "nanoworks.mlsolve:main"
qeconverter = "nanoworks.qeconverter:main"
vaspconverter = "nanoworks.vaspconverter:main"
nanoworks = "nanoworks.cli:main"
